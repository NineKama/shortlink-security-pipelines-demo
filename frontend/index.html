<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortLink – Rút gọn link</title>
<style>
  :root {
    --bg: #eef3f1; --surface: #ffffff; --ink: #10241f; --muted: #5b6f69;
    --line: #cfdcd7; --accent: #0b6e4f; --accent-ink: #ffffff; --error: #a4262c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1a17; --surface: #16261f; --ink: #e6f0ec; --muted: #94aaa3;
      --line: #2a4038; --accent: #4fd1a1; --accent-ink: #06231a; --error: #ff8a8f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 4rem 1.25rem 3rem; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; margin: 0 0 .5rem; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 2rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=url] {
    flex: 1 1 16rem; min-width: 0; padding: .9rem 1rem; font: inherit; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: .5rem;
  }
  button {
    padding: .9rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: .5rem;
  }
  button.small { padding: .35rem .8rem; font-size: .875rem; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input:focus-visible { border-color: var(--accent); }
  #message { min-height: 1.5rem; margin: .75rem 0 0; }
  #message.error { color: var(--error); }
  #result {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    margin-top: 1rem; padding: 1rem; background: var(--surface);
    border-left: 4px solid var(--accent); border-radius: .5rem;
  }
  #result[hidden] { display: none; }
  #result a { font-size: 1.25rem; font-weight: 600; word-break: break-all; }
  a { color: var(--accent); }
  h2 { font-size: 1.125rem; margin: 3rem 0 .75rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .875rem; }
  td.url { max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Link dài quá? Cắt ngắn lại.</h1>
  <p class="lead">Dán link vào ô bên dưới để nhận một link ngắn, dễ chia sẻ.</p>

  <form id="form">
    <input id="url" type="url" name="url" required placeholder="https://vi-du.com/mot-duong-dan-rat-dai" aria-label="Link cần rút gọn">
    <button type="submit">Rút gọn link</button>
  </form>
  <p id="message" role="status"></p>

  <div id="result" hidden>
    <a id="short" href="#" target="_blank" rel="noopener noreferrer"></a>
    <button id="copy" class="small" type="button">Sao chép</button>
  </div>

  <h2>Link vừa tạo</h2>
  <p id="empty">Chưa có link nào. Hãy rút gọn link đầu tiên ở trên.</p>
  <div class="table-wrap">
    <table id="table" hidden>
      <thead><tr><th>Link ngắn</th><th>Link gốc</th><th class="num">Lượt bấm</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
